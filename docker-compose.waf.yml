# Local-only stack to test WAF
#
# Usage:
# docker compose -f docker-compose.waf.yml up --build -d
# sh scripts/waf/smoke.sh
# docker compose -f docker-compose.waf.yml down -v

name: cluster-map-waf

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-app}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-app}
      POSTGRES_DB: ${PG_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["pnpm", "--dir", "/app/packages/db", "db:migrate"]
    environment:
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER:-app}
      PG_PASSWORD: ${PG_PASSWORD:-app}
      PG_DB: ${PG_DB:-app}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["node", "dist/index.js"]
    environment:
      NODE_ENV: production
      API_PORT: 5000
      WEB_ORIGIN: http://localhost:${WAF_PORT:-8080}
      BETTER_AUTH_URL: http://localhost:${WAF_PORT:-8080}
      BETTER_AUTH_SECRET: local-only-secret-at-least-32-characters-long
      PG_HOST: db
      PG_PORT: 5432
      PG_USER: ${PG_USER:-app}
      PG_PASSWORD: ${PG_PASSWORD:-app}
      PG_DB: ${PG_DB:-app}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WAF_PORT:-8080}:8080"
    environment:
      API_UPSTREAM: api:5000
      REAL_IP_HEADER: X-Forwarded-For
      REAL_IP_RECURSIVE: "on"
      SET_REAL_IP_FROM: 172.31.66.0/24
      MODSEC_RULE_ENGINE: "On"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "2"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
    depends_on:
      - api

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.66.0/24
