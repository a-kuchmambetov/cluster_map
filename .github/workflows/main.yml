name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, coolify]
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed apps
        id: changes
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            const { detectChangedApps } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/deploy/changed-apps.mjs`);
            await detectChangedApps({ github, context, core, branch: "main", workflow: "main.yml" });

  images:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: [self-hosted, linux, x64, coolify]
    environment: production
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cluster-map-${APP}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.app }} production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:production
            ${{ steps.image.outputs.name }}:production-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=production-${{ matrix.app }}

  deploy:
    needs: images
    runs-on: [self-hosted, linux, x64, coolify]
    environment: production
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Deploy to Coolify
        env:
          WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          : "${WEBHOOK:?Set COOLIFY_PRODUCTION_WEBHOOK to deploy all four production services}"
          : "${TOKEN:?Set COOLIFY_TOKEN}"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN"
