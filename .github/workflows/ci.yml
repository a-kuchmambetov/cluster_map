name: CI
on:
  pull_request:
    branches: [main, staging]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: cluster_map_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d cluster_map_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_USER: ci
      PG_PASSWORD: disposable-ci-password
      PG_DB: cluster_map_ci
      BETTER_AUTH_SECRET: disposable-ci-auth-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:5000
      WEB_ORIGIN: http://localhost:5173
      GITHUB_CLIENT_ID: disposable-ci-github-client-id
      GITHUB_CLIENT_SECRET: disposable-ci-github-client-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.5.2
        working-directory: /tmp
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm --filter @repo/api... build
      - run: pnpm typecheck
      - run: pnpm --filter @repo/worker test
      - run: pnpm --filter @repo/api test
      - run: pnpm db:migrate
      - run: pnpm --filter @repo/api test:integration
        env:
          AUTH_DB_TEST: "1"
      - run: pnpm --filter @repo/web test
      - run: node --test scripts/deploy/*.test.mjs
      - run: pnpm build
      - run: pnpm build:docs
  waf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f apps/web/Dockerfile -t cluster-map-web:ci .
      - name: Start the stub backend behind the WAF
        run: |
          docker network create --subnet 172.31.67.0/24 waf-ci
          docker run -d --name stub --network waf-ci \
            -v "$PWD/scripts/waf/stub-backend.mjs:/stub-backend.mjs:ro" \
            node:24-alpine node /stub-backend.mjs
          docker run -d --name waf --network waf-ci -p 8080:8080 \
            -e API_UPSTREAM=stub:8081 \
            -e REAL_IP_HEADER=X-Forwarded-For \
            -e REAL_IP_RECURSIVE=on \
            -e SET_REAL_IP_FROM=172.31.67.0/24 \
            -e MODSEC_RULE_ENGINE=On \
            -e BLOCKING_PARANOIA=1 \
            -e DETECTION_PARANOIA=2 \
            cluster-map-web:ci
      - name: Wait for nginx to accept requests
        run: |
          for _ in $(seq 40); do
            curl -sf http://localhost:8080/healthz >/dev/null && exit 0
            sleep 2
          done
          echo "WAF did not become ready" >&2
          exit 1
      - run: docker exec waf nginx -t
      - run: sh scripts/waf/smoke.sh --stub
        env:
          BASE_URL: http://localhost:8080
      - name: Container logs
        if: failure()
        run: docker logs waf && docker logs stub
