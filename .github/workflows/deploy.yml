name: Deploy
on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful Publish run ID (same artifacts used in staging)
        required: true
        type: string
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Reviewer runs the exact API digest's migration before approving this gate.
    environment: ${{ inputs.environment || 'staging' }}
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH_RUN_ID: ${{ inputs.publish_run_id || github.event.workflow_run.id }}
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Validate publication and production promotion
        run: node scripts/deploy/validate-release.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.PUBLISH_RUN_ID }}
          pattern: image-*
          merge-multiple: true
          path: release
      - name: Deploy and verify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_API_UUID: ${{ secrets.COOLIFY_API_UUID }}
          COOLIFY_WEB_UUID: ${{ secrets.COOLIFY_WEB_UUID }}
          COOLIFY_DOCS_UUID: ${{ secrets.COOLIFY_DOCS_UUID }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
          DOCS_URL: ${{ vars.DOCS_URL }}
        run: node scripts/deploy/deploy.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-${{ env.TARGET_ENV }}-${{ env.PUBLISH_RUN_ID }}
          path: release/*.json
          retention-days: 90
