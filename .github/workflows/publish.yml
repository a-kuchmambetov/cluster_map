name: Publish
run-name: Publish ${{ github.ref_name }} · ${{ github.sha }}
on:
  push:
    branches: [staging, main]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, docs]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/a-kuchmambetov/cluster-map-${{ matrix.app }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.app }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          APP: ${{ matrix.app }}
        run: |
          mkdir -p release
          node -e 'require("fs").writeFileSync(`release/${process.env.APP}.json`, JSON.stringify({sha:process.env.GITHUB_SHA,image:`ghcr.io/a-kuchmambetov/cluster-map-${process.env.APP}`,digest:process.env.DIGEST}))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.app }}
          path: release/*.json
          retention-days: 90
