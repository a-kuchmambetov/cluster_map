server_tokens ${SERVER_TOKENS};
more_set_headers 'Server: ${SERVER_HEADER}';

real_ip_header ${REAL_IP_HEADER};
real_ip_recursive ${REAL_IP_RECURSIVE};
set_real_ip_from ${SET_REAL_IP_FROM};

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen ${PORT} default_server;
    server_name ${SERVER_NAME};
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Removed resolver. Now resolved per request via the http-level resolver
        # the image derives from /etc/resolv.conf, so the directive was redundant.
        set $api_upstream "${API_UPSTREAM}";
        proxy_pass http://$api_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Supplies /healthz, which answers without reaching the API and so is what
    # the container HEALTHCHECK targets.
    include includes/location_common.conf;
}
