# Tuning applied AFTER all CRS rules have loaded.
#
# Rule-specific suppression (SecRuleRemoveById, SecRuleUpdateTargetById,
# ctl:ruleRemoveTargetById) belongs here.
#
# Rules for adding an entry:
#   1. Start from a real audit-log entry. Do not pre-emptively exclude.
#   2. Scope it to the narrowest path and the narrowest target that fixes the
#      false positive. Prefer removing one target over removing a rule, and
#      removing one rule over removing a tag or a whole rule family.
#   3. Leave a comment naming the rule ID, the request that tripped it and why
#      it is safe.
#
# Local IDs use the 10000-10999 range, which CRS reserves for site rules.

# (no exclusions required yet — stock CRS at PL1 passes the checks in
# scripts/waf/smoke.sh, including auth POSTs and the SSE stream)
