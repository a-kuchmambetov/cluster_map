# Tuning applied BEFORE the CRS rules load.
#
# Use this file only for things that must exist before CRS initialises:
# ctl:ruleEngine changes, setting tx.* variables, or whole-path allowlisting.
# Rule-specific false-positive suppression belongs in
# RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf, because a rule cannot be
# removed by ID before it has been defined.
#
# Everything added here must be scoped to a path. An unscoped exclusion
# silently disables protection across the whole application, which is the most
# common way a WAF ends up doing nothing.

# (no exclusions required yet — see the operations runbook for the tuning
# workflow, and add entries here only in response to a real audit-log entry)
